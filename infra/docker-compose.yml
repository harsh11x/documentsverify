version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: docverify_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docverify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: docverify_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Local IPFS (Kubo) API for pinning certificate manifests. Set IPFS_KUBO_API_URL=http://127.0.0.1:5001 in .env
  ipfs:
    image: ipfs/kubo:v0.29.0
    container_name: docverify_ipfs
    ports:
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfsdata:/data/ipfs
    environment:
      IPFS_PROFILE: server

volumes:
  pgdata:
  redisdata:
  ipfsdata:
